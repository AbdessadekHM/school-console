<!-- student-form.component.html -->
<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Add New Student</h2>
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="id" class="block text-sm font-medium text-gray-300">ID</label>
        <input
          id="id"
          type="number"
          formControlName="id"
          class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
          [ngClass]="{
            'border-red-500': studentForm.get('id')?.invalid && studentForm.get('id')?.touched
          }"
        />
        <div
          *ngIf="studentForm.get('id')?.invalid && studentForm.get('id')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          ID is required and must be greater than 0.
        </div>
      </div>

      <div>
        <label for="name" class="block text-sm font-medium text-gray-300">Name</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
          [ngClass]="{
            'border-red-500': studentForm.get('name')?.invalid && studentForm.get('name')?.touched
          }"
        />
        <div
          *ngIf="studentForm.get('name')?.invalid && studentForm.get('name')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Name is required and must be at least 2 characters.
        </div>
      </div>

      <div>
        <label for="age" class="block text-sm font-medium text-gray-300">Age</label>
        <input
          id="age"
          type="number"
          formControlName="age"
          class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
          [ngClass]="{
            'border-red-500': studentForm.get('age')?.invalid && studentForm.get('age')?.touched
          }"
        />
        <div
          *ngIf="studentForm.get('age')?.invalid && studentForm.get('age')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Age is required and must be between 1 and 120.
        </div>
      </div>

      <div>
        <label for="grade" class="block text-sm font-medium text-gray-300">Grade</label>
        <input
          id="grade"
          type="text"
          formControlName="grade"
          class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
          [ngClass]="{
            'border-red-500': studentForm.get('grade')?.invalid && studentForm.get('grade')?.touched
          }"
        />
        <div
          *ngIf="studentForm.get('grade')?.invalid && studentForm.get('grade')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Grade is required.
        </div>
      </div>

      <div>
        <label for="address" class="block text-sm font-medium text-gray-300">Address</label>
        <input
          id="address"
          type="text"
          formControlName="address"
          class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
          [ngClass]="{
            'border-red-500': studentForm.get('address')?.invalid && studentForm.get('address')?.touched
          }"
        />
        <div
          *ngIf="studentForm.get('address')?.invalid && studentForm.get('address')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Address is required.
        </div>
      </div>

      <div>
        <label for="phoneNumber" class="block text-sm font-medium text-gray-300">Phone Number</label>
        <input
          id="phoneNumber"
          type="tel"
          formControlName="phoneNumber"
          class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
          [ngClass]="{
            'border-red-500': studentForm.get('phoneNumber')?.invalid && studentForm.get('phoneNumber')?.touched
          }"
        />
        <div
          *ngIf="studentForm.get('phoneNumber')?.invalid && studentForm.get('phoneNumber')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Valid phone number is required.
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
          [ngClass]="{
            'border-red-500': studentForm.get('email')?.invalid && studentForm.get('email')?.touched
          }"
        />
        <div
          *ngIf="studentForm.get('email')?.invalid && studentForm.get('email')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Valid email is required.
        </div>
      </div>

      <button
        type="submit"
        [disabled]="studentForm.invalid"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 disabled:bg-gray-600 disabled:cursor-not-allowed"
      >
       {{currentStudent== null ? "Add Student" : "Edit Student"}}
      </button>
    </form>
  </div>
</div>
